<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ClemensKI</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            black: '#000000',
            darkBg: '#050505',
            darkCard: '#0a0a0a',
            darkBorder: '#1f1f1f'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    body {
      background-color: #000000;
      color: #e5e5e5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #000; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #222; border-radius: 2px; }
    pre { white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body class="bg-black text-gray-200 h-screen flex flex-col justify-between overflow-hidden">

  <!-- Header (Safe Area pt-8 für Handy-Uhrzeit) -->
  <header class="bg-black border-b border-zinc-800 px-4 pt-8 pb-3 flex items-center justify-between z-30 relative">
    <div class="flex flex-col">
      <h1 class="text-xl font-bold tracking-wider text-white">ClemensKI</h1>
      <span id="currentModeLabel" class="text-xs text-zinc-400 font-mono">WEBSITE KI (Powered by Gemini)</span>
    </div>

    <!-- 3 Punkte Menü -->
    <div class="relative">
      <button id="menuBtn" type="button" class="w-12 h-12 flex items-center justify-center text-zinc-300 hover:text-white rounded-full hover:bg-zinc-900 transition-colors">
        <i class="fa-solid fa-ellipsis-vertical text-xl pointer-events-none"></i>
      </button>

      <div id="dropdownMenu" class="hidden absolute right-0 mt-2 w-64 bg-zinc-950 border border-zinc-800 rounded-xl shadow-2xl z-50 py-2">
        <button id="btnSetKey" type="button" class="w-full px-4 py-3 text-left text-sm text-yellow-400 hover:bg-zinc-900 flex items-center gap-3">
          <i class="fa-solid fa-key pointer-events-none"></i> Gemini API-Key eingeben
        </button>
        <button id="btnNewChat" type="button" class="w-full px-4 py-3 text-left text-sm text-zinc-200 hover:bg-zinc-900 flex items-center gap-3">
          <i class="fa-solid fa-plus text-zinc-400 pointer-events-none"></i> Neuer Chat
        </button>
        <button id="btnHistory" type="button" class="w-full px-4 py-3 text-left text-sm text-zinc-200 hover:bg-zinc-900 flex items-center gap-3">
          <i class="fa-solid fa-clock-rotate-left text-zinc-400 pointer-events-none"></i> Verlauf löschen
        </button>
        <div class="my-1 border-t border-zinc-800"></div>
        <button id="btnModeWeb" type="button" class="w-full px-4 py-3 text-left text-sm text-zinc-200 hover:bg-zinc-900 flex items-center justify-between">
          <span class="flex items-center gap-3 pointer-events-none"><i class="fa-solid fa-code text-zinc-400"></i> Website KI</span>
          <i id="checkWeb" class="fa-solid fa-check text-xs text-white pointer-events-none"></i>
        </button>
        <button id="btnModeBiz" type="button" class="w-full px-4 py-3 text-left text-sm text-zinc-200 hover:bg-zinc-900 flex items-center justify-between">
          <span class="flex items-center gap-3 pointer-events-none"><i class="fa-solid fa-chart-line text-zinc-400"></i> Business KI</span>
          <i id="checkBiz" class="fa-solid fa-check text-xs text-white hidden pointer-events-none"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Chat Verlauf -->
  <main id="chatContainer" class="flex-1 overflow-y-auto px-4 py-6 space-y-4 custom-scrollbar">
  </main>

  <!-- Input Bereich -->
  <footer class="bg-black border-t border-zinc-800 p-3 pb-6 z-20">
    <div class="max-w-4xl mx-auto flex items-center gap-2 bg-zinc-900 border border-zinc-800 rounded-full px-4 py-2">
      <input id="userInput" type="text" placeholder="Schreibe eine Nachricht..." class="flex-1 bg-transparent text-white focus:outline-none placeholder-zinc-500 text-sm" />
      <button id="sendBtn" type="button" class="text-white hover:text-zinc-300 p-2">
        <i class="fa-solid fa-paper-plane pointer-events-none"></i>
      </button>
    </div>
  </footer>

  <script>
    let currentMode = 'web';
    let apiKey = localStorage.getItem('gemini_api_key') || '';
    let chatHistory = JSON.parse(localStorage.getItem('clemens_history') || '[]');

    const menuBtn = document.getElementById('menuBtn');
    const dropdownMenu = document.getElementById('dropdownMenu');
    const chatContainer = document.getElementById('chatContainer');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const btnModeWeb = document.getElementById('btnModeWeb');
    const btnModeBiz = document.getElementById('btnModeBiz');
    const checkWeb = document.getElementById('checkWeb');
    const checkBiz = document.getElementById('checkBiz');
    const currentModeLabel = document.getElementById('currentModeLabel');

    // Menü steuern
    menuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdownMenu.classList.toggle('hidden');
    });

    document.addEventListener('click', (e) => {
      if (!dropdownMenu.contains(e.target) && e.target !== menuBtn) {
        dropdownMenu.classList.add('hidden');
      }
    });

    // API Key festlegen
    document.getElementById('btnSetKey').addEventListener('click', (e) => {
      e.stopPropagation();
      const input = prompt('Füge hier deinen kostenlosen Google Gemini API Key ein:', apiKey);
      if (input !== null) {
        apiKey = input.trim();
        localStorage.setItem('gemini_api_key', apiKey);
        alert(apiKey ? 'API Key erfolgreich gespeichert!' : 'API Key entfernt.');
      }
      dropdownMenu.classList.add('hidden');
    });

    // Modus Wechsel
    btnModeWeb.addEventListener('click', (e) => {
      e.stopPropagation();
      currentMode = 'web';
      currentModeLabel.innerText = 'WEBSITE KI (Gemini)';
      checkWeb.classList.remove('hidden');
      checkBiz.classList.add('hidden');
      dropdownMenu.classList.add('hidden');
    });

    btnModeBiz.addEventListener('click', (e) => {
      e.stopPropagation();
      currentMode = 'biz';
      currentModeLabel.innerText = 'BUSINESS KI (Gemini)';
      checkBiz.classList.remove('hidden');
      checkWeb.classList.add('hidden');
      dropdownMenu.classList.add('hidden');
    });

    document.getElementById('btnNewChat').addEventListener('click', (e) => {
      e.stopPropagation();
      chatContainer.innerHTML = '';
      chatHistory = [];
      localStorage.removeItem('clemens_history');
      dropdownMenu.classList.add('hidden');
      showWelcomeMessage();
    });

    document.getElementById('btnHistory').addEventListener('click', (e) => {
      e.stopPropagation();
      if(confirm('Möchtest du den gesamten Verlauf löschen?')) {
        chatContainer.innerHTML = '';
        chatHistory = [];
        localStorage.removeItem('clemens_history');
        showWelcomeMessage();
      }
      dropdownMenu.classList.add('hidden');
    });

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    if (chatHistory.length > 0) {
      chatHistory.forEach(msg => appendMessageUI(msg.role, msg.parts[0].text));
    } else {
      showWelcomeMessage();
    }

    function showWelcomeMessage() {
      appendMessageUI('model', 'Willkommen bei **ClemensKI**!\n\nIch liefere dir echtes Gemini-Niveau. Tippe oben auf die 3 Punkte und trage 1-malig deinen kostenlosen **Gemini API-Key** ein, um voll durchzustarten!');
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      if (!apiKey) {
        appendMessageUI('model', '⚠️ Bitte klicke oben rechts auf die 3 Punkte und füge deinen kostenlosen **Gemini API Key** ein!');
        return;
      }

      appendMessageUI('user', text);
      
      // Verlauf im Gemini Format speichern
      chatHistory.push({ role: 'user', parts: [{ text: text }] });
      saveHistory();
      userInput.value = '';

      // Anzeigetext "ClemensKI SCHREIBT..."
      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'text-xs text-zinc-500 font-mono my-2 animate-pulse';
      loadingDiv.innerText = 'ClemensKI SCHREIBT...';
      chatContainer.appendChild(loadingDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      const systemInstruction = currentMode === 'web'
        ? "Du bist ClemensKI, eine führende KI für Web-Entwicklung. Antworte mit professionellem, vollständigem HTML/CSS/JS Code oder präzisen Erklärungen zu Webdesign."
        : "Du bist ClemensKI, ein High-Level Business-Strategie-Coach. Gib extrem konkrete, umsetzbare Tipps zu Business-Modellen, Marketing, Finanzen und Skalierung.";

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: systemInstruction }] },
            contents: chatHistory
          })
        });

        const data = await response.json();
        chatContainer.removeChild(loadingDiv);

        if (data.error) {
          appendMessageUI('model', '❌ Fehler von Gemini API: ' + data.error.message);
          return;
        }

        const replyText = data.candidates[0].content.parts[0].text;
        appendMessageUI('model', replyText);
        
        chatHistory.push({ role: 'model', parts: [{ text: replyText }] });
        saveHistory();

      } catch (error) {
        if (chatContainer.contains(loadingDiv)) chatContainer.removeChild(loadingDiv);
        appendMessageUI('model', 'Entschuldigung, es gab ein Verbindungsproblem zu Gemini.');
      }
    }

    function appendMessageUI(role, text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = role === 'user' ? 'flex justify-end' : 'flex justify-start';
      
      let formattedText = text.replace(/```([\s\S]*?)```/g, '<pre class="bg-zinc-900 border border-zinc-800 text-green-400 p-3 rounded-lg my-2 font-mono text-xs overflow-x-auto">$1</pre>');
      formattedText = formattedText.replace(/\n/g, '<br>');

      msgDiv.innerHTML = `
        <div class="${role === 'user' ? 'bg-zinc-800 text-white' : 'bg-zinc-950 border border-zinc-800 text-zinc-200'} px-4 py-2.5 rounded-2xl max-w-[88%] text-sm leading-relaxed">
          ${formattedText}
        </div>
      `;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function saveHistory() {
      localStorage.setItem('clemens_history', JSON.stringify(chatHistory));
    }
  </script>
</body>
</html>
